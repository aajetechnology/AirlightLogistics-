<!DOCTYPE html>
<html>
<head>
    <title>ADMIN CONTROL ROOM</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html {margin:0; height:100%; font-family:Arial;}
        #map {width:100%; height:100vh;}
        .info {position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.7); color:white; padding:15px; z-index:1000; border-radius:10px;}
    </style>
</head>
<body>
<div class="info">
    <h2>ADMIN CONTROL ROOM</h2>
    <p>Active Buses: <span id="count">0</span></p>
</div>
<div id="map"></div>

<script>
const map = L.map('map').setView([9.0, 8.0], 6); // Nigeria center
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

setInterval(() => {
    fetch('/api/active-trips/')
    .then(r => r.json())
    .then(data => {
        document.getElementById('count').textContent = data.length;
        data.forEach(bus => {
            if (!bus.marker) {
                bus.marker = L.marker([bus.lat, bus.lng]).addTo(map)
                    .bindPopup(`Bus ${bus.driver_id}<br>${bus.destination}<br>Speed: ${bus.speed} km/h`);
            } else {
                bus.marker.setLatLng([bus.lat, bus.lng]);
            }
        });
    });
}, 5000);
</script>
</body>
</html>
