<!DOCTYPE html>
<html>
<head>
    <title>Student Safe Travel - Login</title>
    <style>
        body {font-family:Arial; text-align:center; margin-top:100px; background:#f0f8ff;}
        .box {width:400px; margin:0 auto; padding:40px; background:white; border-radius:20px; box-shadow:0 10px 40px rgba(0,0,0,0.2);}
        input {width:100%; padding:15px; margin:12px 0; font-size:18px; border:1px solid #ccc; border-radius:10px;}
        button {width:100%; padding:16px; background:#0066ff; color:white; border:none; border-radius:10px; font-size:20px;}
        .error {color:red; background:#ffe6e6; padding:10px; border-radius:10px;}
    </style>
</head>
<body>
<div class="box">
    <h1>STUDENT SAFE TRAVEL</h1>
    <h2>Login</h2>

    {% if messages %}
        {% for message in messages %}
            <p class="error">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %} <!-- THIS FIXES THE 403 ERROR -->
        <input type="email" name="email" placeholder="School Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">LOGIN</button>
    </form>

    <p style="margin-top:20px;">
        <a href="/register/student/">Register as Student</a> | 
        <a href="/register/regular/">Regular Passenger</a>
    </p>
</div>
</body>
</html>
