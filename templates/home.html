<!-- templates/home.html -->
<!DOCTYPE html>
<html>
<head><title>Student Safe Travel</title></head>
<body style="text-align:center; margin-top:100px; font-family:Arial;">
    <h1>STUDENT SAFE TRAVEL</h1>
    {% if user.is_authenticated %}
        <p>Welcome, {{ user.get_full_name }}!</p>
        {% if user.student %}
            <a href="{% url 'passenger_dashboard' %}">Go to My Dashboard</a>
        {% else %}
            <a href="{% url 'trip_list' %}">View Available Trips</a>
        {% endif %}
        <p><a href="{% url 'logout' %}">Logout</a></p>
    {% else %}
        <p><a href="{% url 'login' %}">Login</a> | 
           <a href="/register/student/">Register as Student</a></p>
    {% endif %}
</body>
</html>
